# VERSIONS — API host on nuncio-vultr (UI is Netlify).
#
# Image is built in GitHub Actions → ghcr.io/thisyearnofear/versions
# Deploy: git push → wait for image (or rely on deploy.sh retry) →
#         ./scripts/deploy-remote.sh  (pull only — no on-box next build)
#
# Emergency on-box build: DEPLOY_BUILD_ON_BOX=1 ./scripts/deploy.sh

services:
  app:
    image: ${VERSIONS_IMAGE:-ghcr.io/thisyearnofear/versions:latest}
    container_name: versions
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/uploads:/app/data/uploads
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.versions-web.loadbalancer.server.port=3000
      - traefik.http.routers.versions-api.entrypoints=https
      - traefik.http.routers.versions-api.rule=Host(`api.versions.persidian.com`)
      - traefik.http.routers.versions-api.tls.certresolver=letsencrypt
      - traefik.http.routers.versions-api.service=versions-web

networks:
  coolify:
    external: true
