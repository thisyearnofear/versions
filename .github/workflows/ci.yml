name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Lint is now a blocking gate: the pre-existing
      # `react-hooks/set-state-in-effect` errors were cleared with scoped
      # suppression comments (the codebase's established idiom for these
      # intentional reset/load-on-mount effects). Remaining output is
      # warning-only and does not fail the build.
      - name: Lint
        run: npm run lint