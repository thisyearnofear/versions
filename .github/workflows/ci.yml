name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Lint is currently non-blocking: the repo ships with pre-existing
      # `react-hooks/set-state-in-effect` errors (a newer eslint rule) plus
      # warning-level issues. We still run it and surface the report in the
      # log for visibility; flip `continue-on-error` to false once the
      # pre-existing failures are cleared.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint