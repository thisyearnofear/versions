# Netlify — public UI (versions.persidian.com)
#
# API stays on the box: https://api.versions.persidian.com
# Site: versions-persidian (papajams) → custom domain versions.persidian.com
#
# Required Netlify env (production):
#   NEXT_PUBLIC_API_URL=https://api.versions.persidian.com
#   NEXT_PUBLIC_APP_URL=https://versions.persidian.com
#   NEXT_PUBLIC_ARC_RPC_URL / NEXT_PUBLIC_ARC_EXPLORER_URL / NEXT_PUBLIC_WC_PROJECT_ID
#
# Required box .env:
#   ALLOWED_ORIGINS=https://versions.persidian.com,https://versions-persidian.netlify.app
#   (plus PINATA_JWT / LOCAL_UPLOADS=0 when ready)

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
